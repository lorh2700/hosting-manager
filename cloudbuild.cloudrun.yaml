steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - -t
      - ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}
      - -f
      - Dockerfile
      - .
  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}
images:
  - ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}
substitutions:
  _AR_HOSTNAME: asia-northeast3-docker.pkg.dev
  _AR_PROJECT_ID: voidanchae
  _AR_REPOSITORY: cloud-run-source-deploy
  _IMAGE_NAME: hosting-manager-legacy
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
