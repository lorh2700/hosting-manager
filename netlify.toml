[build]
command = "npm run build"
publish = ".next"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
package = "@netlify/plugin-nextjs"

## iCal redirects — /ical/{slug} → Beds24 원본. edge 301 이라 캐시 효율 좋음.
## 슬러그가 아닌 것 (예: /ical/anonjae) 은 backward compat 용. 신규 지점은
## /ical/{slug} 규칙으로 통일. netlify.toml 에 항목이 없는 slug 는
## app/ical/[slug]/route.ts 동적 fallback 이 처리한다 (DB lookup).

[[redirects]]
  from = "/ical/anon"
  to = "https://api.beds24.com/ical/bookings.ics?roomid=665802"
  status = 301

[[redirects]]
  from = "/ical/anonjae"                            # legacy alias — 기존 등록된 OTA 유지
  to = "https://api.beds24.com/ical/bookings.ics?roomid=665802"
  status = 301

[[redirects]]
  from = "/ical/hwayeonjae"
  to = "https://api.beds24.com/ical/bookings.ics?roomid=667806"
  status = 301

[[redirects]]
  from = "/ical/unwadang"
  to = "https://api.beds24.com/ical/bookings.ics?roomid=664844"
  status = 301

[[redirects]]
  from = "/ical/byulha"
  to = "https://api.beds24.com/ical/bookings.ics?roomid=704756"
  status = 301
